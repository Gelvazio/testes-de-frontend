<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Projetos dos Alunos</title>
    <link rel="stylesheet" href="css/estilo.css" />
  </head>
  <body>
    <header class="cabecalho">
      <h1 class="cabecalho__titulo">Projetos dos Alunos</h1>
      <p class="cabecalho__subtitulo">
        Repositórios publicados no GitHub. Clique em um aluno para ver os projetos.
      </p>
    </header>

    <main class="conteudo">
      <section class="grade-alunos" id="grade-alunos" aria-label="Alunos"></section>
      <p class="rodape-dados" id="rodape-dados"></p>
    </main>

    <dialog class="modal" id="modal-projetos" aria-labelledby="modal-titulo">
      <header class="modal__cabecalho">
        <img class="modal__avatar" id="modal-avatar" alt="" width="56" height="56" />
        <div>
          <h2 class="modal__titulo" id="modal-titulo"></h2>
          <a class="modal__perfil" id="modal-perfil" target="_blank" rel="noopener">
            Ver perfil no GitHub
          </a>
        </div>
        <button class="modal__fechar" id="modal-fechar" type="button" aria-label="Fechar">
          &times;
        </button>
      </header>
      <ul class="lista-projetos" id="lista-projetos"></ul>
    </dialog>

    <script src="js/dados-alunos.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
