<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculadora</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">

        <h1>CALCULADORA - IMC</h1>

        <form id="formulario">

            <label for="nome">Nome</label>
            <input type="text" id="nome" placeholder="Digite seu nome" required>

            <label for="altura">Altura</label>
            <input type="number" id="altura" placeholder="Ex: 1.75" step="0.01" min="0.5" max="2.5" required>

            <label for="peso">Peso (Kg):</label>
            <input type="number" id="peso" placeholder="Ex: 70" step="0.1" min="1" max="500" required>

            <button type="submit">Calcular</button>

        </form>

        <div id="resultado" class="resultado">Preencha os dados para calcular seu IMC</div>
    </div>
    <script src="script.js"></script>
</body>
</html>
