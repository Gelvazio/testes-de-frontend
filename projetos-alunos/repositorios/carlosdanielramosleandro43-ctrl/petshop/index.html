<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetShop - Universo Pet</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-50 text-slate-800 antialiased font-sans">
    <header class="bg-white shadow-sm sticky top-0 z-50 ">
        <div class="max-w-6xl mx-auto px-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <a href="#" class="text-2xl text-amber-600 flex items-center gap-2">🐾<span class="tracking-tight">Universo
                    Pet</span></a>
            <nav aria-label="Menu principal">
                <ul class="flex space-x-6">
                    <li><a href="#servicos"
                            class="text-slate-600 hover:text-amber-600 transition duration-200">Serviços</a></li>
                    <li><a href="#sobre" class="text-slate-600 hover:text-amber-600 transition duration-200">Sobre
                            Nós</a></li>
                    <li><a href="#agendamento"
                            class="text-slate-600 hover:text-amber-600 transition duration-200">Agendamento</a></li>
                </ul>
        </div>
        </nav>
    </header>
    <main class="max-w-6xl mx-auto px-4 py-8 space-y-16">
        <section class="grid-cols-1 md:grid-cols-2 gap-8 items-center bg-gradient-to-br from-amber-50 to-orange-50
        p-8 rounded-3x1">
            <div class="space-y-6">
                <h1 class="text-4xl md:text-5xl font-black">O cuidado que seu pet merece.</h1>
                <p class="text-lg">Agende banhos, tosa e cunsulta veterinárias em 1 minuto. Sem filas e com especialistas.</p>
                <a href="#agendamento">Agenda banho e tosa</a>
            </div>
            <div class="relative">
                <img src="https://images.unsplash.com/photo-1516734212186-a967f81ad0d7?&fit=auto=format&w=600&q=80"
                 alt="cachorro tomando banho" class="rounded-2xl shadow-md w-full object-cover h-64 md:h-96">
            <div>
        <section>
    <main>
    <footer></footer>
</body>

</html>
