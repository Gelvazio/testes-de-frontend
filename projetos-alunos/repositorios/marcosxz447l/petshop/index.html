<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetShop - Universo Pet</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-blue-200 text-black antialiased font-extralight">
    <header class="bg-slate-200 shadow-sm sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <a href="#" class="text-2xl text-amber-600 flex items-center gap-2 aling-center">🐾<span class="tracking-tight ">Universo
                    Pet🐾</span></a>
            <nav>
                <ul class="flex space-x-10 text-sm font-medium">
                    <li><a href="#servicos"
                            class="text-slate-600 hover:text-amber-600 transition duration-200">Serviços</a></li>
                    <li><a href="#sobre" class="text-slate-600 hover:text-amber-600 transition duration-200">Sobre
                            Nós</a></li>
                    <li><a href="#agendamento"
                            class="text-slate-600 hover:text-amber-600 transition duration-200">Agendamento</a></li>
                </ul>
        </div>
        </nav>
    </header>
    <main class="max-w-6x6 mx-auto px-7 py-9 space-y-20">
        <section class="grid-cols-1 md:grid-cols-2 gap-8 items-center bg-gradient-to-br from-slate-400
        to-blue-100">
            <div>
                <h1 class="text-4xl md:text-5x2"><i><h2>O cuidado que seu pet merece.</h2></i></h1>
                <p>Agenda banhos, tosa e consulta veterinaria em 1 minuto.  sem filas e com especialistas.</p>
                <a href="#agendamento">Agendar banho e tosa</a>
            </div class="relative">
            <img src="https://images.unsplash.com/photo-1516734212186-a967f81ad0d7?w=500&q=80" alt="cachorro tomando banho " class="rounded-2xl shadow-md w-full object-cover h-64 md:h-96">
        </section>
    </main>
    <footer></footer>
</body>

</html>
